<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Create SOW Records</title>
    <script src="/widgets/create-sow-record/zoho-shim.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div
      class="main-container w-screen h-screen overflow-hidden flex bg-white relative"
      id="container"
    >
      <div
        id="data-container"
        class="w-full h-full overflow-y-auto opacity-0 hidden fade-in bg-white p-6 sm:p-8"
      >
        <div class="h-full flex flex-col justify-around">
          <div class="flex flex-col gap-6">
            <!-- select stage -->
            <div class="w-full relative">
              <div class="mb-2 w-full">
                <p class="text-lg font-medium text-gray-700">Select a Stage:</p>
              </div>
              <div class="flex w-full">
                <select
                  id="stage-select"
                  class="px-4 py-3 border border-gray-300 rounded-lg shadow focus:outline-none focus:ring-2 focus:ring-blue-500 w-full bg-gray-50 text-gray-700"
                >
                  <option value="" disabled selected>Select a stage</option>
                  <option value="Opportunity Spotted">Opportunity Spotted</option>
                  <option value="Client Sending RFP">Client Sending RFP</option>
                  <option value="Sourcing Vendor">Sourcing Vendor</option>
                </select>
              </div>
            </div>

            <!-- client & vendor bid due date -->
            <div class="flex w-full items-baseline gap-4">
              <div class="w-full">
                <label
                  for="client-bid-due-date"
                  class="block text-sm font-medium text-gray-700"
                  >Client Bid Due Date</label
                >
                <input
                  type="date"
                  name="client-bid-due-date"
                  id="client-bid-due-date"
                  class="mt-1 block w-full px-2.5 py-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                />
              </div>
              <div class="w-full">
                <label
                  for="vendor-bid-due-date"
                  class="block text-sm font-medium text-gray-700"
                  >Vendor Bid Due Date</label
                >
                <input
                  type="date"
                  name="vendor-bid-due-date"
                  id="vendor-bid-due-date"
                  class="mt-1 block w-full px-2.5 py-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                />
              </div>
            </div>

            <!-- Client Site Visit Contact -->
            <div class="flex w-full items-baseline">
              <div class="w-full relative">
                <label for="people" class="block text-sm font-medium text-gray-700"
                  >Client Site Visit Contact</label
                >
                <input
                  type="text"
                  name="people"
                  id="people"
                  class="mt-1 block w-full px-2.5 py-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                />
                <span id="people-err" class="text-red-500 text-sm"></span>
                <ul
                  id="people-suggestions"
                  class="absolute bg-white border border-gray-300 w-full mt-1 rounded-md shadow-lg hidden max-h-40 overflow-y-auto z-10"
                ></ul>
              </div>
            </div>

            <!-- Select Contract Type -->
            <div class="w-full">
              <label class="text-sm font-medium text-gray-700"
                >Select Contract Type</label
              >
              <div class="flex w-full">
                <select
                  id="contract-type-select"
                  class="px-4 py-3 mt-1 border border-gray-300 rounded-lg shadow focus:outline-none focus:ring-2 focus:ring-blue-500 w-full bg-gray-50 text-gray-700"
                >
                  <option value="New" selected>New</option>
                  <option value="">-None-</option>
                  <option value="Renewal">Renewal</option>
                </select>
              </div>
            </div>

            <!-- SOW Item -->
            <div class="w-full relative">
              <label for="name" class="block text-sm font-medium text-gray-700"
                >SOW Item</label
              >
              <input
                type="text"
                name="name"
                id="name"
                class="mt-1 block w-full px-2.5 py-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
              />
              <span id="sow-item-err" class="text-red-500 text-sm"></span>
              <ul
                id="name-suggestions"
                class="absolute bg-white border border-gray-300 w-full mt-1 rounded-md shadow-lg hidden max-h-40 overflow-y-auto"
              ></ul>
            </div>

            <!-- start & end date -->
            <div class="flex w-full items-baseline gap-4">
              <div class="w-full">
                <label for="startDate" class="block text-sm font-medium text-gray-700"
                  >Start Date</label
                >
                <input
                  type="date"
                  name="startDate"
                  id="startDate"
                  class="mt-1 block w-full px-2.5 py-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                />
              </div>
              <div class="w-full">
                <label for="endDate" class="block text-sm font-medium text-gray-700"
                  >End Date</label
                >
                <input
                  type="date"
                  name="endDate"
                  id="endDate"
                  class="mt-1 block w-full px-2.5 py-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                />
              </div>
            </div>

            <!-- client & vendor price -->
            <div class="flex w-full items-center gap-2">
              <div class="w-full">
                <label
                  for="client-price"
                  class="block text-sm font-medium text-gray-700"
                  >Client Price</label
                >
                <input
                  type="text"
                  name="client-price"
                  id="client-price"
                  class="mt-1 block w-full px-2.5 py-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                />
              </div>
              <div class="w-full">
                <label
                  for="vendor-price"
                  class="block text-sm font-medium text-gray-700"
                  >Vendor Price</label
                >
                <input
                  type="text"
                  name="vendor-price"
                  id="vendor-price"
                  class="mt-1 block w-full px-2.5 py-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                />
              </div>
            </div>

            <div class="text-right">
              <button
                id="addRow"
                class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-800"
              >
                Add Row
              </button>
            </div>
          </div>

          <div>
            <div
              id="table-container"
              class="flex flex-col-reverse gap-3 max-h-80 overflow-y-auto"
            ></div>
            <div class="mt-6 mb-4 flex justify-end">
              <button
                id="create-button"
                class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                Create
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
