<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SOW Widget</title>
        <script src="zoho-shim.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="sow_widget.css" />
        <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css" rel="stylesheet" />
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>

    </head>

    <body>
        <div class="main-container" id="container">
            <form id="sowForm">
                <!-- SOW Number -->
                <div class="mb-2">
                    <label for="sowNumber" class="form-label">SOW Number</label>
                    <input type="text" class="form-control" id="sowNumber" placeholder="Enter SOW Number" readonly />
                </div>

                <!-- Who do you want to send to -->
                <div>
                    <h4 class="h4">Who do you want to send to?</h4>
                    <div class="mb-3">
                    <label for="vendorSearch" class="form-label">Select Vendors</label>
                    <select multiple id="e1" style="width:300px">
                    </select>
                    <div id="selectedVendorsContainer"></div>
                </div>

                    <!-- Email to Vendors Description -->
                    <div class="mt-4 mb-2">
                        <label for="emailDescription" class="mb-2 form-label">Email to Vendors</label>
                        <div id="emailDescription"></div>
                    </div>

                    <div class="attachArea">
                        <div class="mb-3 mt-4 file-upload-container" id="vendorAttach">
                            <label for="sowAttachment" class="mb-2 form-label">Attachments</label>
                            <input type="file" class="form-control formAttach" id="sowAttachment" multiple />
                            <ul id="fileList" class="file-list"></ul>
                        </div>

                        <div class="mb-3 mt-4 file-upload-container" id="siteMapAttach">
                            <label for="siteMap" class="mb-2 form-label">Site Map</label>
                            <input type="file" class="form-control formAttach" id="siteMap" />
                            <ul id="siteMapList" class="file-list"></ul>
                        </div>
                    </div>
                </div>

                <!-- SOW Overview -->
                <div>
                    <h4 class="h4 mb-4">Overview</h4>

                    <div class="attachArea">
                        <!-- Site Number -->
                        <div class="mb-3">
                            <label for="siteNumber" class="form-label">Site Number</label>
                            <input type="text" class="form-control" id="siteNumber" placeholder="Enter Site Number" readonly />
                        </div>

                        <!-- Company Name -->
                        <div class="mb-3">
                            <label for="companyName" class="form-label">Company Name</label>
                            <input type="text" class="form-control" id="companyName" placeholder="Enter Company Name" readonly />
                        </div>
                    </div>

                    <!-- Address Fields -->
                    <div class="attachArea">
                        <div class="mb-3">
                            <label for="streetAddress" class="form-label">Street Address</label>
                            <input type="text" class="form-control" id="streetAddress" placeholder="Enter Street Address" />
                        </div>

                        <div class="mb-3">
                            <label for="zipCode" class="form-label">ZIP Code</label>
                            <input type="text" class="form-control" id="zipCode" placeholder="Enter ZIP Code" />
                        </div>
                    </div>

                    <div class="attachArea">
                        <div class="mb-3">
                            <label for="city" class="form-label">City</label>
                            <input type="text" class="form-control" id="city" placeholder="Enter City" />
                        </div>
                        <div class="mb-3">
                            <label for="state" class="form-label">State</label>
                            <input type="text" class="form-control" id="state" placeholder="Enter State" />
                        </div>
                    </div>
                </div>

                <!-- Scope of Work -->
                <div id="scopeOfWork">
                    <h4 class="h4 mb-4">Scope of Work</h4>
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead id="sowTableHead"></thead>
                            <tbody id="sowTableBody"></tbody>
                        </table>
                    </div>
                    <div class="mt-4">
                        <!-- Winter Specific Vendor Notes -->
                        <div id="winterNotes" class="mb-3">
                            <label for="winterNotes" class="form-label">Winter Specific Vendor Notes</label>
                            <div class="notes"></div>
                        </div>
                        <!-- Summer Specific Vendor Notes -->
                        <div id="summerNotes" class="mb-3">
                            <label for="summerNotes" class="form-label">Summer Specific Vendor Notes</label>
                            <div class="notes"></div>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="mb-3">
                    <button type="submit" class="btn btn-primary">
                        <div class="spinner-border text-light" role="status" id="spinner">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <span id="buttonText">Send Email</span>
                    </button>
                </div>
                <!-- form end -->
            </form>
        </div>
    </body>
    <script src="sow_widget.js"></script>
</html>
